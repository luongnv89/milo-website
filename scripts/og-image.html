<!doctype html>
<!--
  Source for public/og-image-v2.png (1200x630), styled after the landing hero.
  Regenerate with:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=10000 \
      --screenshot=public/og-image-v2.png \
      "file://$PWD/scripts/og-image.html"
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&display=swap"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
        background: #fafaf7;
        color: #111110;
        -webkit-font-smoothing: antialiased;
      }
      .frame {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 48px 64px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand img {
        width: 44px;
        height: 44px;
        border-radius: 11px;
      }
      .brand span {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #111110;
      }
      .url {
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: #6f6c66;
      }
      .main {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 56px;
      }
      .copy {
        flex: 1;
        min-width: 0;
      }
      .eyebrow {
        font-size: 14px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #6f6c66;
      }
      h1 {
        margin-top: 20px;
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 84px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.01em;
        color: #111110;
      }
      h1 em {
        font-style: italic;
      }
      .sub {
        margin-top: 24px;
        max-width: 600px;
        font-size: 21px;
        line-height: 1.55;
        color: #55534e;
      }
      .cta-row {
        margin-top: 36px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 52px;
        padding: 0 26px;
        border-radius: 9999px;
        background: #1d4ed8;
        color: #ffffff;
        font-size: 17px;
        font-weight: 500;
      }
      .btn svg {
        width: 20px;
        height: 20px;
      }
      .price {
        font-size: 15px;
        color: #6f6c66;
      }
      .phone-wrap {
        position: relative;
        flex: 0 0 auto;
        display: flex;
        justify-content: center;
      }
      .glow {
        position: absolute;
        inset: -64px;
        background: radial-gradient(60% 60% at 50% 45%, rgba(59, 130, 246, 0.16), transparent 70%);
      }
      .phone {
        position: relative;
        width: 236px;
        border-radius: 46px;
        background: #111110;
        padding: 8px;
        box-shadow: 0 40px 80px -30px rgba(17, 17, 16, 0.35);
      }
      .screen {
        position: relative;
        border-radius: 38px;
        overflow: hidden;
        background: #000000;
        aspect-ratio: 9 / 19.5;
      }
      .island {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 82px;
        height: 25px;
        border-radius: 9999px;
        background: #000000;
        z-index: 2;
      }
      .screen img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="topbar">
        <div class="brand">
          <img src="../public/AppIcon-180.png" alt="MILO app icon" />
          <span>MILO</span>
        </div>
        <div class="url">askmilo.pro</div>
      </div>
      <div class="main">
        <div class="copy">
          <p class="eyebrow">For iPhone &amp; CarPlay · iOS 17.6+</p>
          <h1>Ask <em>real AI</em> through Siri. Hands-free.</h1>
          <p class="sub">
            Say &ldquo;Hey Siri, ask MILO&rdquo; — get a short spoken answer from GPT, Claude, Gemini,
            or 200+ models. No app to open. No typing.
          </p>
          <div class="cta-row">
            <span class="btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z" />
                <path d="M10 2c1 .5 2 2 2 5" />
              </svg>
              Download on the App Store
            </span>
            <span class="price">$8.99 one-time · Bring your own keys</span>
          </div>
        </div>
        <div class="phone-wrap">
          <div class="glow"></div>
          <div class="phone">
            <div class="screen">
              <div class="island"></div>
              <img src="../public/1.0.0/car-play-mode.PNG" alt="MILO answering a hands-free question in CarPlay mode" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
